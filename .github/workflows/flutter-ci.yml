name: Validar CitaApp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Descargar dependencias
        run: flutter pub get

      - name: Revisar el codigo
        run: flutter analyze

      - name: Compilar APK de prueba
        run: flutter build apk --debug
